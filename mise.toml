[vars]
app = "VO2Max"

[tools]
uv = "latest"
cmake = "4.4"
ninja = "latest"
node = "lts"   # lv_font_conv (mise run assets)
# Arm GNU Toolchain (upstream of ST's "GNU Tools for STM32". No ST account needed).
# The SDK CI (una-sdk/.github/workflows/apps-ci.yml) builds in xanderhendriks/stm32cubeide:16.0,
# which is STM32CubeIDE 1.19.0 -> GNU Tools for STM32 13.3.rel1 (per ST release notes).
# Recheck apps-ci.yml for an update version when bumping the SDK tag below.
gcc-arm-none-eabi = "13.3.Rel1"

[env]
UNA_SDK = "{{config_root}}/una-sdk"
_.python.venv = { path = ".venv" }

# Host packages for the Linux (GCC + SDL2) LVGL simulator. Not needed for firmware builds.
[bootstrap.packages]
# Pacman:
"pacman:base-devel" = "latest"
"pacman:git" = "latest"
"pacman:sdl2-compat" = "latest"
"pacman:gdb" = "latest"
# Apt:
"apt:build-essential" = "latest"
"apt:git" = "latest"
"apt:libsdl2-dev" = "latest"
"apt:gdb" = "latest"

[bootstrap.repos]
"una-sdk" = { url = "https://github.com/UNAWatch/una-sdk.git", ref = "sdk-v1.5.0" }

# Runs last in `mise bootstrap` after the SDK is cloned and tools are installed.
[tasks.bootstrap]
run = [
  "git -C una-sdk submodule update --init ThirdParty/lvgl",
  "uv sync",
]

# Docs: sdk-setup.html#building-apps-manually and Tutorials/RunLVGL/ARCHITECTURE.html
[tasks.build]
description = "Build the .uapp"
dir = "Software/Apps/{{vars.app}}-CMake"
run = ["cmake -G Ninja -S . -B build", "cmake --build build"]

[tasks.sim-build]
description = "Build the Linux simulator"
dir = "Software/Apps/LVGL-GUI/simulator"
run = ["cmake -G Ninja -S . -B build -DCMAKE_BUILD_TYPE=Debug", "cmake --build build"]

[tasks.sim]
description = "Build and run the Linux simulator"
depends = ["sim-build"]
usage = '''
flag "--config <file>" help="Companion app config (app_config.json), e.g. simulator-configs/max-hr-190.json"
flag "--fs <dir>" help="Folder copied into the simulator's file system, e.g. simulator-configs/fs/history"
'''
run = '''
set -e
fs=Software/Output
mkdir -p "$fs"
if [ -n "${usage_config:-}" ]; then cp "$usage_config" "$fs/app_config.json"; fi
if [ -n "${usage_fs:-}" ]; then cp -r "$usage_fs/." "$fs/"; fi
cd Software/Apps/LVGL-GUI/simulator/build/bin
./{{vars.app}}Simulator
'''

[tasks.assets]
description = "Regenerate LVGL fonts and images"
dir = "Software/Apps/LVGL-GUI/assets"
run = "python gen_assets.py"

[tasks.icons]
description = "Regenerate the app icons in Resources/"
run = "python tools/make_icons.py"

[tasks.replay]
description = "Replay a recorded .fit through the estimator and guidance"
usage = '''
arg "<fit>" help="Activity file, e.g. copied from Apps/<app>/Activity/"
arg "<max_hr>" help="Max HR the run used"
arg "[interval]" help="Seconds between lines" default="30"
'''
run = [
  "cmake -G Ninja -S Software/Tests -B Software/Tests/build >/dev/null",
  "cmake --build Software/Tests/build --target vo2-replay >/dev/null",
  "python tools/fit_csv.py \"$usage_fit\" | Software/Tests/build/vo2-replay \"$usage_max_hr\" \"$usage_interval\"",
]

[tasks.analysis-data]
description = "Download the Malaga treadmill dataset and verify it"
run = """
mkdir -p data_analysis/data/malaga_vo2_max && cd data_analysis/data/malaga_vo2_max
url=https://physionet.org/files/treadmill-exercise-cardioresp/1.0.1
for f in SHA256SUMS.txt LICENSE.txt subject-info.csv test_measure.csv; do curl -sSfLO "$url/$f"; done
sha256sum -c SHA256SUMS.txt
"""

[tasks.analysis-test]
description = "Run the analysis package tests"
run = "VIRTUAL_ENV= uv run --project data_analysis pytest data_analysis/tests -q"

[tasks.analysis]
description = "Start JupyterLab for the analysis"
run = "VIRTUAL_ENV= uv run --project data_analysis --group notebook jupyter lab --notebook-dir data_analysis"

[tasks.test]
description = "Build and run the host unit tests (Docs/unit-testing.md)"
dir = "Software/Tests"
run = [
  "cmake -G Ninja -S . -B build -DCMAKE_BUILD_TYPE=Debug",
  "cmake --build build",
  "ctest --test-dir build --output-on-failure",
]

[tasks.clean]
description = "Remove build output"
run = "rm -rf Software/Apps/{{vars.app}}-CMake/build Software/Apps/LVGL-GUI/simulator/build Software/Tests/build"
